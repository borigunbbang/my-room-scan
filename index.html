<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Room 3D Splat Viewer</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #0a0a0a;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  #app {
    position: relative;
    width: 100%;
    height: 100%;
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
  }
  #status {
    position: absolute;
    top: 12px;
    left: 12px;
    background: rgba(0, 0, 0, 0.6);
    color: #eee;
    padding: 10px 14px;
    border-radius: 8px;
    font-size: 13px;
    line-height: 1.6;
    min-width: 220px;
    pointer-events: none;
    z-index: 10;
  }
  #status .step {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  #status .mark {
    display: inline-block;
    width: 14px;
    text-align: center;
  }
  #status .ok .mark { color: #4caf50; }
  #status .fail .mark { color: #f44336; }
  #status .pending .mark { color: #888; }
  #status .fail .hint {
    display: block;
    color: #ff8a80;
    font-size: 11px;
    margin-left: 20px;
  }
  #stats {
    margin-top: 8px;
    padding-top: 8px;
    border-top: 1px solid rgba(255,255,255,0.2);
    font-size: 12px;
    color: #bbb;
  }
  #flip-btn {
    position: absolute;
    top: 12px;
    right: 12px;
    z-index: 10;
    background: rgba(0, 0, 0, 0.6);
    color: #eee;
    border: 1px solid rgba(255,255,255,0.3);
    border-radius: 8px;
    padding: 8px 12px;
    font-size: 13px;
    cursor: pointer;
  }
  #flip-btn:hover {
    background: rgba(0, 0, 0, 0.8);
  }
</style>
</head>
<body>
<div id="app">
  <div id="status">
    <div class="step pending" data-step="lib"><span class="mark">○</span> 라이브러리 불러오기</div>
    <div class="step pending" data-step="renderer"><span class="mark">○</span> 렌더러 넣기</div>
    <div class="step pending" data-step="fetch"><span class="mark">○</span> 파일 받기</div>
    <div class="step pending" data-step="parse"><span class="mark">○</span> 알갱이로 풀기</div>
    <div class="step pending" data-step="fit"><span class="mark">○</span> 크기 재기</div>
    <div id="stats"></div>
  </div>
  <button id="flip-btn" title="위아래가 뒤집혀 보이면 눌러 주세요">위아래 뒤집기</button>
</div>

<!-- 여기서 파일 이름을 바꿀 수 있습니다 -->
<script>
  window.SPLAT_FILE = "room.sog";
</script>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/",
    "@sparkjsdev/spark": "https://cdn.jsdelivr.net/npm/@sparkjsdev/spark@2.2.0/dist/spark.module.js"
  }
}
</script>

<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { SparkRenderer, SplatMesh } from "@sparkjsdev/spark";

const statusEl = document.getElementById("status");
const statsEl = document.getElementById("stats");

function setStep(name, state, hint) {
  const el = statusEl.querySelector(`[data-step="${name}"]`);
  if (!el) return;
  el.className = `step ${state}`;
  const mark = el.querySelector(".mark");
  mark.textContent = state === "ok" ? "✓" : state === "fail" ? "✗" : "○";
  let hintEl = el.querySelector(".hint");
  if (hint) {
    if (!hintEl) {
      hintEl = document.createElement("span");
      hintEl.className = "hint";
      el.appendChild(hintEl);
    }
    hintEl.textContent = hint;
  } else if (hintEl) {
    hintEl.remove();
  }
}

// 확장자 -> Spark 내부 형식 이름 대응표
const FILE_TYPE_MAP = {
  ply: "ply",
  splat: "splat",
  ksplat: "ksplat",
  spz: "spz",
  sog: "pcsogszip",
};

function guessFileType(filename) {
  const ext = filename.split(".").pop().toLowerCase();
  return FILE_TYPE_MAP[ext] || ext;
}

setStep("lib", "ok");

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(window.devicePixelRatio);
renderer.setSize(window.innerWidth, window.innerHeight);
document.getElementById("app").appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.01, 1000);
camera.position.set(0, 0, 5);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;

let sparkRenderer;
try {
  sparkRenderer = new SparkRenderer({ renderer });
  scene.add(sparkRenderer);
  setStep("renderer", "ok");
} catch (e) {
  setStep("renderer", "fail", String(e).slice(0, 80));
}

let splatMesh = null;
let flipped = false;

document.getElementById("flip-btn").addEventListener("click", () => {
  if (!splatMesh) return;
  flipped = !flipped;
  splatMesh.rotation.z = flipped ? Math.PI : 0;
});

async function loadSplat() {
  const filename = window.SPLAT_FILE;
  const fileType = guessFileType(filename);

  let bytes, downloadMs, fileSizeMB;
  try {
    const t0 = performance.now();
    const res = await fetch(filename);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const buf = await res.arrayBuffer();
    bytes = new Uint8Array(buf);
    downloadMs = performance.now() - t0;
    fileSizeMB = bytes.byteLength / 1e6;
    setStep("fetch", "ok");
  } catch (e) {
    setStep(
      "fetch",
      "fail",
      `'${filename}' 파일을 못 받았습니다. 같은 폴더에 있는지, 이름이 맞는지 보세요. (${e.message})`
    );
    return;
  }

  try {
    splatMesh = new SplatMesh({ fileBytes: bytes, fileType });
    await splatMesh.initialized;
    scene.add(splatMesh);
    setStep("parse", "ok");

    const count = splatMesh.numSplats ?? "?";
    statsEl.innerHTML =
      `파일 크기: ${fileSizeMB.toFixed(2)}MB<br>` +
      `받는 시간: ${(downloadMs / 1000).toFixed(2)}초<br>` +
      `알갱이 개수: ${count}`;
  } catch (e) {
    setStep(
      "parse",
      "fail",
      `형식 이름이 맞는지 보세요 (.sog는 'pcsogszip'). 오류: ${e.message}`
    );
    return;
  }

  try {
    const box = splatMesh.getBoundingBox();
    if (!box || box.isEmpty()) throw new Error("빈 상자 (Spark 쪽 자를 못 읽음)");

    const size = new THREE.Vector3();
    box.getSize(size);
    const center = new THREE.Vector3();
    box.getCenter(center);
    const radius = size.length() * 0.5;

    controls.target.copy(center);
    camera.position.copy(center).add(new THREE.Vector3(0, 0, radius * 1.8 || 5));
    camera.near = Math.max(radius / 100, 0.001);
    camera.far = radius * 100 || 1000;
    camera.updateProjectionMatrix();
    controls.update();

    setStep("fit", "ok");
  } catch (e) {
    setStep(
      "fit",
      "fail",
      `카메라 위치를 못 정했습니다. 화면에 아무것도 안 보이면 마우스를 크게 끌어 보세요. (${e.message})`
    );
    // 실패해도 기본 위치에서 계속 진행
  }
}

loadSplat();

window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

renderer.setAnimationLoop(() => {
  controls.update();
  renderer.render(scene, camera);
});
</script>
</body>
</html>
